[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-credit-monitor-windows"
version = "0.1.0"
description = "Native Windows desktop monitor for Codex credit allocation"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "tzdata>=2025.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "black>=24.10",
    "pre-commit>=4.0",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
include = ["codex_credit_monitor_windows*"]

[tool.black]
target-version = ["py312"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
